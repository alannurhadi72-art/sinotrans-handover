<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sinotrans Sparepart - Shift Handover Log</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      body { background: white !important; color: black !important; padding: 0 !important; }
      .shadow-md, .shadow-sm, .shadow-lg { box-shadow: none !important; }
      .border { border-color: #cbd5e1 !important; }
    }
    .print-only { display: none; }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col">

  <!-- HEADER / NAVBAR -->
  <header class="bg-gradient-to-r from-slate-900 via-red-950 to-slate-900 text-white shadow-lg no-print">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="bg-red-700 text-white p-2.5 rounded-lg shadow-md flex items-center justify-center">
          <i class="fa-solid fa-boxes-stacked text-2xl"></i>
        </div>
        <div>
          <h1 class="text-xl md:text-2xl font-bold tracking-tight text-white flex items-center gap-2">
            SINOTRANS SPAREPART
            <span class="text-xs font-semibold uppercase bg-red-700 text-white px-2 py-0.5 rounded tracking-wide">Shift Log</span>
          </h1>
          <p class="text-xs text-slate-300">Aplikasi Serah Terima Operational & Stock Control Handover</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <button onclick="fetchCloudData()" title="Sinkronisasi Cloud Data" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow-sm">
          <i class="fa-solid fa-rotate text-red-400" id="syncIcon"></i>
          <span class="hidden sm:inline">Sync Cloud</span>
        </button>
        <button onclick="openConfigModal()" title="Pengaturan API Cloud" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow-sm">
          <i class="fa-solid fa-gear text-slate-400"></i>
        </button>
        <button onclick="exportToCSV()" class="bg-emerald-700 hover:bg-emerald-800 text-white px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow-sm">
          <i class="fa-solid fa-file-excel"></i>
          <span>Ekspor CSV</span>
        </button>
        <button onclick="triggerPrint()" class="bg-red-700 hover:bg-red-800 text-white px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow-sm">
          <i class="fa-solid fa-print"></i>
          <span>Cetak PDF</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full space-y-6">

    <!-- STATS DASHBOARD -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 no-print">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between border-l-4 border-l-slate-700">
        <div>
          <p class="text-xs font-medium text-slate-500 uppercase">Total Handover</p>
          <h3 id="statTotal" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
        </div>
        <div class="bg-slate-100 text-slate-700 p-3 rounded-full">
          <i class="fa-solid fa-clipboard-list text-xl"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between border-l-4 border-l-amber-500">
        <div>
          <p class="text-xs font-medium text-slate-500 uppercase">Status Pending</p>
          <h3 id="statPending" class="text-2xl font-bold text-amber-600 mt-1">0</h3>
        </div>
        <div class="bg-amber-50 text-amber-600 p-3 rounded-full">
          <i class="fa-solid fa-clock text-xl"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between border-l-4 border-l-red-600">
        <div>
          <p class="text-xs font-medium text-slate-500 uppercase">Prioritas High/Urgent</p>
          <h3 id="statUrgent" class="text-2xl font-bold text-red-600 mt-1">0</h3>
        </div>
        <div class="bg-red-50 text-red-600 p-3 rounded-full">
          <i class="fa-solid fa-triangle-exclamation text-xl"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between border-l-4 border-l-emerald-600">
        <div>
          <p class="text-xs font-medium text-slate-500 uppercase">Selesai (Done)</p>
          <h3 id="statCompleted" class="text-2xl font-bold text-emerald-600 mt-1">0</h3>
        </div>
        <div class="bg-emerald-50 text-emerald-600 p-3 rounded-full">
          <i class="fa-solid fa-circle-check text-xl"></i>
        </div>
      </div>
    </div>

    <!-- MAIN FORM & TABLE SECTION -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

      <!-- FORM ADD LOG (4 COLS ON LARGE SCREEN) -->
      <div class="lg:col-span-4 bg-white p-5 rounded-xl border border-slate-200 shadow-sm no-print self-start">
        <h2 class="text-lg font-bold text-slate-900 border-b border-slate-100 pb-3 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-square-plus text-red-700"></i>
          Form Input Serah Terima
        </h2>

        <form id="handoverForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
          <input type="hidden" id="editLogId">

          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Tanggal & Shift</label>
            <div class="grid grid-cols-2 gap-2">
              <input type="date" id="formDate" required class="w-full text-xs border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-red-700 focus:outline-none">
              <select id="formShift" required class="w-full text-xs border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-red-700 focus:outline-none">
                <option value="Shift 1">Shift 1 (Pagi)</option>
                <option value="Shift 2">Shift 2 (Siang)</option>
                <option value="Shift 3">Shift 3 (Malam)</option>
              </select>
            </div>
          </div>

          <!-- DIVISI PENGIRIM & TUJUAN -->
          <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-3">
            <div>
              <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Divisi Asal (Pengirim)</label>
              <select id="formFromDept" required class="w-full text-xs border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-red-700 focus:outline-none bg-white">
                <option value="Inventory">Inventory</option>
                <option value="Inbound">Inbound</option>
                <option value="Outbound">Outbound</option>
                <option value="RMA">RMA</option>
                <option value="Dispatch">Dispatch</option>
                <option value="POD">POD</option>
              </select>
